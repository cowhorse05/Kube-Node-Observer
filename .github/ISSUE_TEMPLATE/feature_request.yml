name: Feature request
description: Propose a focused runtime-diagnostics improvement
title: "feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What operator problem cannot be solved with the current CLI or ecosystem integration?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Existing ecosystem alternatives
      description: Explain whether Prometheus, OpenTelemetry, Parca, Pyroscope, Tetragon, Inspektor Gadget or Kata Monitor already covers this need.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Runtime and data-quality boundaries
      description: Note runc/Kata and Host/Guest implications, including missing or partial evidence.
